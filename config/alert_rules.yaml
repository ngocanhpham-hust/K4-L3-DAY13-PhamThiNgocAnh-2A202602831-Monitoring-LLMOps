alerts:
  - name: HighLatencyP95
    severity: warning
    condition: p95(response_sent.latency_ms) > 2000
    duration: 5m
    type: symptom-based
    channel: "slack:#k4-l3b-alerts"
    owner: student-2A202602831
    runbook: docs/alerts.md#alert-1
  - name: HighRequestErrorRate
    severity: critical
    condition: rate(request_failed) / rate(request_received) * 100 > 2
    duration: 3m
    type: symptom-based
    channel: "slack:#k4-l3b-alerts"
    owner: student-2A202602831
    runbook: docs/alerts.md#alert-2
  - name: LowRetrievalSuccessRate
    severity: warning
    condition: rate(tool_success == true) / rate(tool_success != null) * 100 < 90
    duration: 5m
    type: symptom-based
    channel: "slack:#k4-l3b-alerts"
    owner: student-2A202602831
    runbook: docs/alerts.md#alert-3
