service: day13-l3b-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 2000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  example_window_requests: 10000
  allowed_bad_requests: 50
  note: Baseline bình thường thấp hơn 2000 ms; ngưỡng này phát hiện tail latency của challenge rag_slow. Với 10,000 request trong 28 ngày, error budget 0.5% cho phép tối đa 50 request lỗi hoặc chậm hơn 2000 ms.
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
